<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PYM Split</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">

  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    }
  }
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="icon-192.png" alt="PYM Split" class="auth-logo">
        <h1>PYM Split</h1>
        <p class="auth-subtitle" data-i18n="index.subtitle">Split expenses, not friendships</p>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" type="button" data-i18n="index.tab_login">Sign in</button>
        <button id="tab-register" class="tab-btn" type="button" data-i18n="index.tab_register">Create account</button>
      </div>

      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label for="login-email" data-i18n="index.email">Email</label>
          <input type="email" id="login-email" data-i18n-placeholder="index.email_placeholder" placeholder="you@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password" data-i18n="index.password">Password</label>
          <input type="password" id="login-password" placeholder="                        " required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="btn-login" data-i18n="index.login_button">Sign in</button>
        <p id="login-error" class="error-msg"></p>
      </form>

      <form id="form-register" class="auth-form hidden">
        <div class="form-group">
          <label for="register-name" data-i18n="index.register_name">Full name</label>
          <input type="text" id="register-name" data-i18n-placeholder="index.register_name_placeholder" placeholder="John Smith" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="register-email" data-i18n="index.email">Email</label>
          <input type="email" id="register-email" data-i18n-placeholder="index.email_placeholder" placeholder="you@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="register-password" data-i18n="index.password">Password</label>
          <input type="password" id="register-password" data-i18n-placeholder="index.password_placeholder" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="btn-register" data-i18n="index.register_button">Create account</button>
        <p id="register-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
