<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PYM Split - Iniciar sesión</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">

  <!-- âš ï¸ IMPORT MAP PARA SUPABASE (esto faltaba) -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    }
  }
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="icon-192.png" alt="PYM Split" class="auth-logo">
        <h1>PYM Split</h1>
        <p class="auth-subtitle">Divide gastos, no amistades</p>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" type="button">Iniciar sesión</button>
        <button id="tab-register" class="tab-btn" type="button">Crear cuenta</button>
      </div>

      <!-- Formulario de Login -->
      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="                        " required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
        <p id="login-error" class="error-msg"></p>
      </form>

      <!-- Formulario de Registro -->
      <form id="form-register" class="auth-form hidden">
        <div class="form-group">
          <label for="register-name">Nombre completo</label>
          <input type="text" id="register-name" placeholder="Juan PÃ©rez" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="register-password">Contraseña</label>
          <input type="password" id="register-password" placeholder="MÃ­nimo 6 caracteres" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary">Crear cuenta</button>
        <p id="register-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
